name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/yt-dlp-gui.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Download release runtime files
        run: |
          mkdir -p .build/ffmpeg .build/yt-dlp
          npm install --no-save ffmpeg-static @ffprobe-installer/ffprobe
          cp "$(node -p "require('ffmpeg-static')")" .build/ffmpeg/ffmpeg
          cp "$(node -p "require('@ffprobe-installer/ffprobe').path")" .build/ffmpeg/ffprobe
          chmod +x .build/ffmpeg/ffmpeg
          chmod +x .build/ffmpeg/ffprobe
          curl --fail --location --output .build/yt-dlp/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x .build/yt-dlp/yt-dlp
      - name: Build macOS executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name yt-dlp-gui-macos \
            --add-binary ".build/ffmpeg/ffmpeg:ffmpeg" \
            --add-binary ".build/ffmpeg/ffprobe:ffmpeg" \
            --add-binary ".build/yt-dlp/yt-dlp:yt-dlp" \
            app.py
          chmod +x dist/yt-dlp-gui-macos
      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - dist/yt-dlp-gui-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/yt-dlp-gui-macos

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/yt-dlp-gui.exe
            release/yt-dlp-gui-macos
